<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: deep navy top-left → very dark bottom-right -->
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1829"/>
      <stop offset="100%" stop-color="#040c18"/>
    </linearGradient>
    <!-- Mark gradient: sky blue top → deep teal bottom -->
    <linearGradient id="mg" x1="5" y1="6" x2="27" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <!-- Glow -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>

  <!-- Gradient border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7"
        fill="none" stroke="url(#mg)" stroke-width="1" stroke-opacity="0.4"/>

  <!-- NL combined mark with gradient + glow -->
  <path
    d="M5.5 6.5 L5.5 25.5 M5.5 6.5 L16 25.5 M16 6.5 L16 25.5 L26.5 25.5"
    fill="none"
    stroke="url(#mg)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>
